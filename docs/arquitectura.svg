<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8a3e"/>
    </marker>
  </defs>
  <rect width="1200" height="1000" fill="#ffffff"/>

  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Arquitectura del clúster bigdata-2 (7 contenedores · 1 NameNode + 3 DataNodes)</text>

  <!-- Host -->
  <rect x="20" y="58" width="1160" height="122" rx="10" fill="#f4f4f4" stroke="#888" stroke-dasharray="6 4"/>
  <text x="36" y="82" font-size="15" font-weight="bold" fill="#333">Equipo anfitrión (localhost)</text>
  <rect x="36" y="94" width="250" height="72" rx="8" fill="#fff" stroke="#666"/>
  <text x="161" y="120" text-anchor="middle" font-size="14" font-weight="bold">Navegador / terminal</text>
  <text x="161" y="140" text-anchor="middle" font-size="12">docker compose up -d</text>
  <text x="161" y="157" text-anchor="middle" font-size="12">docker compose stop worker2 …</text>
  <text x="310" y="88" font-size="13" font-weight="bold" fill="#333">Bind mounts (carpetas del repositorio):</text>
  <text x="310" y="108" font-size="12.5">./data  →  /data   (master, worker1, worker2, worker3, livy, zeppelin)  ·  grades.csv, grupo02/resultados/</text>
  <text x="310" y="127" font-size="12.5">./init.sql  →  /docker-entrypoint-initdb.d/init.sql   (hivemetastore)</text>
  <text x="310" y="146" font-size="12.5">./livy_batches  →  /livy_batches   (livy)</text>
  <text x="310" y="165" font-size="12.5">./zeppelin_notebooks  →  /zeppelin_notebooks   (zeppelin)</text>

  <!-- Network -->
  <rect x="20" y="215" width="1160" height="770" rx="10" fill="#eef4fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="1164" y="240" text-anchor="end" font-size="15" font-weight="bold" fill="#2c5a94">Red Docker spark_net · bridge · subred 172.28.0.0/16 · IP fija por contenedor + extra_hosts</text>

  <!-- host -> network -->
  <line x1="161" y1="166" x2="161" y2="262" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="170" y="200" font-size="12" fill="#333">puertos publicados</text>
  <text x="170" y="214" font-size="11" fill="#555">9870 · 8088 · 8180 · 18080 · 8890 · 8998 …</text>

  <!-- zeppelin -->
  <rect x="40" y="262" width="330" height="128" rx="8" fill="#f1eafa" stroke="#7b55b3" stroke-width="1.5"/>
  <text x="55" y="286" font-size="15" font-weight="bold">zeppelin · 172.28.1.5</text>
  <text x="55" y="304" font-size="11.5" fill="#555">panovvv/zeppelin-bigdata:2.5.2</text>
  <text x="55" y="328" font-size="13">Apache Zeppelin 0.9.0</text>
  <text x="55" y="346" font-size="13">Notebooks web: Spark, PySpark, SQL, Hive</text>
  <text x="55" y="372" font-size="13" font-weight="bold" fill="#7b55b3">UI :8890</text>

  <!-- livy -->
  <rect x="435" y="262" width="330" height="128" rx="8" fill="#f1eafa" stroke="#7b55b3" stroke-width="1.5"/>
  <text x="450" y="286" font-size="15" font-weight="bold">livy · 172.28.1.6</text>
  <text x="450" y="304" font-size="11.5" fill="#555">panovvv/livy:2.5.2</text>
  <text x="450" y="328" font-size="13">Apache Livy 0.7.0</text>
  <text x="450" y="346" font-size="13">API REST para enviar trabajos Spark</text>
  <text x="450" y="372" font-size="13" font-weight="bold" fill="#7b55b3">REST :8998 · SPARK_MASTER=yarn</text>

  <!-- hivemetastore -->
  <rect x="830" y="262" width="330" height="128" rx="8" fill="#fdf0e2" stroke="#c77a1f" stroke-width="1.5"/>
  <text x="845" y="286" font-size="15" font-weight="bold">hivemetastore · 172.28.1.4</text>
  <text x="845" y="304" font-size="11.5" fill="#555">postgres:11.5</text>
  <text x="845" y="328" font-size="13">PostgreSQL: catálogo de Hive</text>
  <text x="845" y="346" font-size="13">BD hivemetastoredb (init.sql)</text>
  <text x="845" y="372" font-size="13" font-weight="bold" fill="#c77a1f">:5432 (solo red interna)</text>

  <!-- master -->
  <rect x="190" y="460" width="820" height="170" rx="8" fill="#e3edf9" stroke="#2c5a94" stroke-width="2"/>
  <text x="205" y="486" font-size="16" font-weight="bold">master · 172.28.1.1</text>
  <text x="205" y="504" font-size="11.5" fill="#555">panovvv/hadoop-hive-spark:2.5.2 · HADOOP_NODE=namenode · HIVE_CONFIGURE</text>
  <rect x="205" y="516" width="190" height="100" rx="6" fill="#fff" stroke="#2c5a94"/>
  <text x="300" y="540" text-anchor="middle" font-size="13" font-weight="bold">HDFS</text>
  <text x="300" y="560" text-anchor="middle" font-size="12">NameNode :9870</text>
  <text x="300" y="577" text-anchor="middle" font-size="12">Secondary NN :9868</text>
  <text x="300" y="594" text-anchor="middle" font-size="12">metadatos y mapa de bloques</text>
  <text x="300" y="610" text-anchor="middle" font-size="11" fill="#2c5a94">replicación 2 · bloque 128 MB</text>
  <rect x="405" y="516" width="190" height="100" rx="6" fill="#fff" stroke="#2c5a94"/>
  <text x="500" y="540" text-anchor="middle" font-size="13" font-weight="bold">YARN</text>
  <text x="500" y="562" text-anchor="middle" font-size="12">ResourceManager</text>
  <text x="500" y="580" text-anchor="middle" font-size="12">UI :8088</text>
  <rect x="605" y="516" width="190" height="100" rx="6" fill="#fff" stroke="#2c5a94"/>
  <text x="700" y="540" text-anchor="middle" font-size="13" font-weight="bold">Spark 2.4.5</text>
  <text x="700" y="562" text-anchor="middle" font-size="12">Master :7077</text>
  <text x="700" y="580" text-anchor="middle" font-size="12">UI :8180 · jobs :4040-43</text>
  <text x="700" y="598" text-anchor="middle" font-size="12">History :18080</text>
  <rect x="805" y="516" width="190" height="100" rx="6" fill="#fff" stroke="#2c5a94"/>
  <text x="900" y="540" text-anchor="middle" font-size="13" font-weight="bold">Hive 3.1.2</text>
  <text x="900" y="562" text-anchor="middle" font-size="12">HiveServer2</text>
  <text x="900" y="580" text-anchor="middle" font-size="12">JDBC :10000</text>

  <!-- workers -->
  <rect x="40" y="715" width="360" height="150" rx="8" fill="#e6f4e8" stroke="#2f8a3e" stroke-width="1.5"/>
  <text x="55" y="740" font-size="15" font-weight="bold">worker1 · 172.28.1.2 · DN1</text>
  <text x="55" y="758" font-size="11.5" fill="#555">panovvv/hadoop-hive-spark:2.5.2 · datanode</text>
  <text x="55" y="784" font-size="13">HDFS DataNode (bloques) · UI :9864</text>
  <text x="55" y="804" font-size="13">YARN NodeManager</text>
  <text x="55" y="824" font-size="13">Spark Worker · UI :8081</text>
  <text x="55" y="850" font-size="12" fill="#2f8a3e">Activo en las dos pruebas</text>

  <rect x="420" y="715" width="360" height="150" rx="8" fill="#e6f4e8" stroke="#2f8a3e" stroke-width="1.5"/>
  <text x="435" y="740" font-size="15" font-weight="bold">worker2 · 172.28.1.3 · DN2</text>
  <text x="435" y="758" font-size="11.5" fill="#555">panovvv/hadoop-hive-spark:2.5.2 · datanode</text>
  <text x="435" y="784" font-size="13">HDFS DataNode (bloques) · UI :9865</text>
  <text x="435" y="804" font-size="13">YARN NodeManager</text>
  <text x="435" y="824" font-size="13">Spark Worker · UI :8082</text>
  <text x="435" y="850" font-size="12" font-weight="bold" fill="#b3261e">Detenido en la prueba de 1 GB</text>

  <rect x="800" y="715" width="360" height="150" rx="8" fill="#e6f4e8" stroke="#2f8a3e" stroke-width="1.5"/>
  <text x="815" y="740" font-size="15" font-weight="bold">worker3 · 172.28.1.7 · DN3</text>
  <rect x="1082" y="726" width="66" height="20" rx="10" fill="#2f8a3e"/>
  <text x="1115" y="740" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">NUEVO</text>
  <text x="815" y="758" font-size="11.5" fill="#555">panovvv/hadoop-hive-spark:2.5.2 · datanode</text>
  <text x="815" y="784" font-size="13">HDFS DataNode (bloques) · UI :9874→9864</text>
  <text x="815" y="804" font-size="13">YARN NodeManager</text>
  <text x="815" y="824" font-size="13">Spark Worker · UI :8083</text>
  <text x="815" y="850" font-size="12" font-weight="bold" fill="#b3261e">Detenido en la prueba de 10 GB</text>

  <!-- arrows -->
  <line x1="370" y1="326" x2="433" y2="326" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="402" y="318" text-anchor="middle" font-size="11">REST</text>
  <line x1="205" y1="390" x2="300" y2="458" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="430" font-size="12">Spark / Hive</text>
  <line x1="560" y1="390" x2="500" y2="458" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="430" font-size="12">trabajos en YARN</text>
  <line x1="900" y1="458" x2="960" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="940" y="436" font-size="12">metastore (JDBC)</text>

  <line x1="400" y1="630" x2="230" y2="713" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="630" x2="600" y2="713" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="800" y1="630" x2="970" y2="713" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="588" y="664" text-anchor="end" font-size="12.5" fill="#333">NameNode → DataNodes</text>
  <text x="588" y="682" text-anchor="end" font-size="11.5" fill="#555">(heartbeats y reportes de bloques)</text>
  <text x="612" y="664" font-size="12.5" fill="#333">RM → NodeManagers</text>
  <text x="612" y="682" font-size="12.5" fill="#333">Spark Master → Workers</text>

  <!-- replicación -->
  <line x1="220" y1="865" x2="220" y2="895" stroke="#2f8a3e" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="600" y1="865" x2="600" y2="895" stroke="#2f8a3e" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="980" y1="865" x2="980" y2="895" stroke="#2f8a3e" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="220" y1="895" x2="980" y2="895" stroke="#2f8a3e" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="330" y="880" width="540" height="30" rx="15" fill="#fff" stroke="#2f8a3e" stroke-width="1.5"/>
  <text x="600" y="900" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f8a3e">Réplicas de bloques HDFS · dfs.replication = 2 · bloques de 128 MB</text>

  <text x="600" y="940" text-anchor="middle" font-size="12.5" fill="#333">Cada bloque se guarda en 2 de los 3 DataNodes. Si uno cae, el archivo se sigue leyendo desde la otra copia</text>
  <text x="600" y="960" text-anchor="middle" font-size="12.5" fill="#333">y el NameNode vuelve a copiar los bloques que faltan en los nodos que siguen vivos.</text>
</svg>
